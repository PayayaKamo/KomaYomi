# Builds the VitePress site in `docs/` and publishes only the static output to
# the `PayayaKamo/KomaYomi-docs` repository, which GitHub Pages serves at
# https://payayakamo.github.io/KomaYomi-docs/ .
#
# Required secret: DOCS_PUBLISH_TOKEN — a token with `repo` write access to
# PayayaKamo/KomaYomi-docs (fine-grained: Contents: read and write). The token
# is only read from the secret; it is never stored in this repository.
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # `base` defaults to `/KomaYomi-docs/`, matching the Pages repository name.
      - name: Build site
        working-directory: docs
        run: npm run docs:build

      - name: Publish build output
        env:
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${DOCS_PUBLISH_TOKEN}@github.com/PayayaKamo/KomaYomi-docs.git"
          checkout="$(mktemp -d)"
          git clone --depth 1 "$remote" "$checkout"

          # The target repo holds build output only: replace everything but .git.
          find "$checkout" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/.vitepress/dist/. "$checkout/"
          touch "$checkout/.nojekyll"

          cd "$checkout"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi

          git commit -m "docs: publish built site from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin main
