# electron-builder packaging.
#
#   npm run dist:win   → NSIS installer + portable exe in ./release
#   npm run dist:dir   → unpacked app, useful to sanity-check the desktop build
#
# The release workflow (`.github/workflows/release.yml`) passes the target platform and
# architecture on the command line (`--win --x64`, `--mac --arm64`, `--linux --x64`, …),
# so the target lists below stay arch-agnostic; without a flag electron-builder uses the
# architecture of the machine it runs on.
#
# Artifact names always carry platform and architecture so that release uploads from the
# six matrix jobs never overwrite each other.
#
# Data (raw/, data/, exports/) is NOT bundled: the app asks for a library folder on
# first launch and remembers it in %APPDATA%/manga-memo/config.json.
appId: com.payayakamo.komayomi
productName: KomaYomi
copyright: Copyright © 2026 PayayaKamo
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
# The built-in demo project is shipped next to the app resources, so the welcome
# screen can open it without downloading anything or asking for a file.
extraResources:
  - from: resources/demo-project.mnproj
    to: demo/demo-project.mnproj
# dist-server/*.mjs already bundles its dependencies, so no node_modules are shipped.
win:
  target:
    - target: nsis
    - target: portable
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KomaYomi
portable:
  artifactName: ${productName}-${version}-win-portable-${arch}.${ext}
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
    - target: deb
  category: Office
  maintainer: PayayaKamo
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
