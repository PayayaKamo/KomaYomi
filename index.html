<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#f07a4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KomaYomi" />
    <meta
      name="description"
      content="KomaYomi（格读）— 本地优先的漫画分格精读工具：日/中/英对照阅读、自动分格、画面对齐、分格级笔记与标注。"
    />
    <meta
      name="keywords"
      content="KomaYomi, 格读, 漫画分格, 漫画阅读器, 语言学习, 日语学习, 对照阅读, 分格检测, 批注, 笔记, manga panel reader, language learning"
    />
    <title>KomaYomi · Manga Panel Reader — 漫画多语言对照阅读与批注</title>
    <script>
      // Apply the theme before first paint so switching never flashes white.
      try {
        var mode = localStorage.getItem('komayomi.theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
